name: Stage6C preview2 dynamic cargo formation
on:
  push:
    branches: [stage6c-preview2-dynamic-cargo-formation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage6c-preview2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Complete Python regression
        run: |
          mkdir -p validation
          set -o pipefail
          python -m unittest discover -s asset_simulation/tests -v 2>&1 | tee validation/tests.log
      - name: Viewer regression
        run: |
          set -o pipefail
          node tools/test_viewer_parameters.cjs | tee validation/viewer.log
      - name: Preview2 cargo formation audit
        if: matrix.python == '3.11'
        run: |
          set -o pipefail
          python -m asset_simulation.audit_stage6c_preview2 --output validation/preview2-audit.json 2>&1 | tee validation/preview2-audit.log
          python tools/demo_stage6c_preview2.py --output validation/preview2-demo.json | tee validation/preview2-demo.log
      - name: Inherited Preview and upstream audits
        if: matrix.python == '3.11'
        run: |
          set -o pipefail
          python -m asset_simulation.audit_stage6c_preview --seeds 42 --years 2 --output validation/preview-parent-audit.json 2>&1 | tee validation/preview-parent.log
          python -m asset_simulation.audit_stage6a --years 2 --output validation/stage6a.json --tables-dir validation/stage6a-tables
      - name: Archive exact source
        if: matrix.python == '3.11'
        run: |
          git rev-parse HEAD > validation/source-commit.txt
          git archive --format=zip HEAD > validation/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage6c-preview2-${{ matrix.python }}-${{ github.sha }}
          path: validation
