name: Stage6B multi-origin destination market
on:
  push:
    branches: [stage6b-multi-origin-east-asia-market]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage6b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Complete Python regression
        run: |
          set -o pipefail
          python -m unittest discover -s asset_simulation/tests -v 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Viewer parameter regression
        run: node tools/test_viewer_parameters.cjs
      - name: Multi-origin fleet sweeps and physical spillover controls
        if: matrix.python == '3.11'
        run: python -m asset_simulation.audit_stage6b --years 20 --output "$RUNNER_TEMP/stage6b-audit.json" --turns-output "$RUNNER_TEMP/seed42-two-origin-265.json"
      - name: Inherited source and contract regressions
        if: matrix.python == '3.11'
        run: |
          python -m asset_simulation.audit_oil_shipping_demand --seeds 0,1,2,3,4,5,6,7 --years 60 > "$RUNNER_TEMP/upstream-audit.json"
          python -m asset_simulation.audit_stage6a --years 20 --output "$RUNNER_TEMP/stage6a-audit.json" --tables-dir "$RUNNER_TEMP/stage6a-tables"
          python -m asset_simulation.audit_stage5a --years 20 --output "$RUNNER_TEMP/stage5a-audit.json"
      - name: Archive exact checked-out source
        if: always() && matrix.python == '3.11'
        run: git archive --format=zip HEAD > "$RUNNER_TEMP/stage6b-source.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage6b-${{ matrix.python }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tests.log
            ${{ runner.temp }}/stage6b-audit.json
            ${{ runner.temp }}/seed42-two-origin-265.json
            ${{ runner.temp }}/upstream-audit.json
            ${{ runner.temp }}/stage6a-audit.json
            ${{ runner.temp }}/stage5a-audit.json
            ${{ runner.temp }}/stage6b-source.zip
