name: Main review candidate regression

on:
  push:
    branches: [main-review-fixes-candidate, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python_version: ['3.11', '3.13']
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
      - name: Complete Python regression suite
        run: |
          set -o pipefail
          python -m unittest discover -s asset_simulation/tests -v 2>&1 | tee "$RUNNER_TEMP/python-tests.log"
      - name: Execute viewer parameter regressions
        run: node tools/test_viewer_parameters.cjs
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.python_version }}-test-evidence
          path: ${{ runner.temp }}/python-tests.log

  seeded-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit original upstream worlds
        run: python -m asset_simulation.audit_oil_shipping_demand --seeds 0,1,2,3,4,5,6,7 --years 60 > "$RUNNER_TEMP/upstream-audit.json"
      - name: Audit repaired pricing worlds
        run: python -m asset_simulation.audit_single_route_pricing --seeds 0,1,5,7,42 --years 20 > "$RUNNER_TEMP/pricing-audit.json"
      - name: Calendar controls and exact upstream hash comparison
        run: python tools/run_review_checks.py --output "$RUNNER_TEMP/review-validation.json"
      - name: Preserve numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seeded-review-audit-evidence
          path: |
            ${{ runner.temp }}/upstream-audit.json
            ${{ runner.temp }}/pricing-audit.json
            ${{ runner.temp }}/review-validation.json
