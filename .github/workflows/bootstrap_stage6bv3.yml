name: Validate staged Stage6B v3
on:
  push:
    branches: [stage6b-v3-transparent-market]
    paths: [.github/workflows/bootstrap_stage6bv3.yml]
permissions:
  contents: write
concurrency:
  group: stage6bv3-bootstrap
  cancel-in-progress: false
jobs:
  verify-source:
    if: github.repository == 'sansuri665/asset_simulation' && github.ref == 'refs/heads/stage6b-v3-transparent-market'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify checksums and isolated base, then reconstruct ordinary source
        run: python tools/materialize_stage6bv3.py
      - name: Complete regression and Viewer checks
        run: |
          mkdir -p "$RUNNER_TEMP/stage6bv3"
          set -o pipefail
          python -m unittest discover -s asset_simulation/tests -v 2>&1 | tee "$RUNNER_TEMP/stage6bv3/tests.log"
          node tools/test_viewer_parameters.cjs | tee "$RUNNER_TEMP/stage6bv3/viewer.log"
      - name: Cargo, future availability, partial loading and real Seed controls
        run: python -m asset_simulation.audit_stage6b_v3 --seeds 42 --years 5 --long-years 5 --output "$RUNNER_TEMP/stage6bv3/audit.json"
      - name: Publish verified source only on requested branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH=stage6b-v3-transparent-market
          LIVE=$(gh api repos/sansuri665/asset_simulation/git/ref/heads/$BRANCH --jq .object.sha)
          test "$LIVE" = "$GITHUB_SHA"
          git merge-base --is-ancestor 6f6aaa24e44784ff3eb0538e488636cff5f7d88b HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add asset_simulation
          git commit -m 'Implement Stage6B-v3 cargo batches, partial loads, committed availability and transparent pricing'
          git push origin HEAD:refs/heads/$BRANCH
          git rev-parse HEAD > "$RUNNER_TEMP/stage6bv3/source-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage6bv3-bootstrap-${{ github.sha }}
          path: ${{ runner.temp }}/stage6bv3
