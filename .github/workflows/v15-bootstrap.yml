name: Directional v1.5 Bootstrap

on:
  push:
    branches:
      - 'calibration/directional-v1.5-work'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply owner and calibration patches
        run: |
          python tools/patch_owner.py
          python tools/patch_forecast_audit.py
          python tools/patch_docs_tests.py
          python tools/patch_acceptance.py
          git diff --check
      - name: Full Python unit suite
        run: python -m unittest discover -s asset_simulation/tests -v
      - name: Commit patched candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add asset_simulation
          git commit -m 'calibration: separate capital owner and cool forecast alpha'
          git push origin HEAD:calibration/directional-v1.5-work
