name: Retire superseded Stage5A branch after verified replacement
on:
  push:
    branches: [stage5a-fixed10-bounded-pressure]
    paths: [.github/workflows/retire_previous_stage5a.yml]
permissions:
  contents: write
jobs:
  retire-exact-old-branch:
    if: github.ref == 'refs/heads/stage5a-fixed10-bounded-pressure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify replacement ancestry and focused invariants
        run: |
          git merge-base --is-ancestor 7c2cc8a1e3b6d8caaac51715624a5d7a85624e46 HEAD
          test -f asset_simulation/model/bounded_route_pricing.py
          python -m unittest asset_simulation.tests.test_bounded_route_pricing asset_simulation.tests.test_stage5a -v
      - name: Delete only the old branch authorized for replacement
        run: |
          old=refs/heads/stage5a-gulf-east-asia-physical-market
          expected=7c2cc8a1e3b6d8caaac51715624a5d7a85624e46
          found=$(git ls-remote origin "$old" | cut -f1)
          if [ -z "$found" ]; then echo 'Old branch already absent'; exit 0; fi
          test "$found" = "$expected"
          git push --force-with-lease="$old:$expected" origin ":$old"
